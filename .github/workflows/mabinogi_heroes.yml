name: Mabinogi Heroes Marketplace & Notice Collector

on:
  schedule:
    - cron: "30 19 * * *"   # Daily at 04:30 KST (19:30 UTC)
  workflow_dispatch:         # Manual run from the Actions tab

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run collection notebook
        env:
          NEXON_HEROES_API_KEY: ${{ secrets.NEXON_HEROES_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: >
          jupyter nbconvert --to notebook --execute
          notebooks/mabinogi_heroes_collect.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.kernel_name=python3
          --ExecutePreprocessor.timeout=600