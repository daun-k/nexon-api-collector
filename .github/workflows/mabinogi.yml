name: Mabinogi Auction History Collector

on:
  workflow_dispatch:   # Triggered every 30 minutes by cron-job.org via the GitHub API

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run collection notebook
        env:
          NEXON_MABINOGI_API_KEY: ${{ secrets.NEXON_MABINOGI_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: >
          jupyter nbconvert --to notebook --execute
          notebooks/mabinogi_collect.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.kernel_name=python3
          --ExecutePreprocessor.timeout=600